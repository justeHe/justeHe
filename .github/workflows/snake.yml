name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current contribution count
        id: get_contributions
        run: |
          # 调用 GitHub GraphQL API
          curl -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
               -X POST -d '{"query":"query { user(login: \"${{ github.repository_owner }}\") { contributionsCollection { contributionCalendar { totalContributions }}}}"}' \
               https://api.github.com/graphql \
            | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions' \
            > current_contributions.txt

      - name: Load previous contribution count
        id: load_previous
        run: |
          if [ -f last_contributions.txt ]; then
            PREV=$(cat last_contributions.txt)
          else
            PREV=0
          fi
          echo "previous=$PREV" >> $GITHUB_OUTPUT

      - name: Compare contributions
        id: compare
        run: |
          CURR=$(cat current_contributions.txt)
          PREV=${{ steps.load_previous.outputs.previous }}
          echo "Current: $CURR, Previous: $PREV"
          if [ "$CURR" != "$PREV" ]; then
            echo "changed=true" >> $GITHUB_ENV
          else
            echo "changed=false" >> $GITHUB_ENV
          fi

      - name: Generate Snake
        if: env.changed == 'true'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update cache & commit
        if: env.changed == 'true'
        run: |
          cp current_contributions.txt last_contributions.txt
          VERSION=$(date +%s)
          sed -i -E "s|(github-contribution-grid-snake-dark\\.svg)\\?v=[0-9]+|\\1?v=$VERSION|g" README.md
          sed -i -E "s|(github-contribution-grid-snake\\.svg)\\?v=[0-9]+|\\1?v=$VERSION|g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ last_contributions.txt README.md
          git commit -m "Update snake, cache, and README version"
          git push
