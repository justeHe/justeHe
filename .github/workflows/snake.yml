name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"  # 每 24 小时运行一次
  workflow_dispatch:        # 可手动触发
  push:
    branches:
      - main              # master 分支 push 时触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 必须有写权限才能推送

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}  # 或用默认 secrets.GITHUB_TOKEN

      - name: Commit and push
        uses: EndBug/add-and-commit@v7.2.1
        with:
          branch: master     # 或 main，根据你的默认分支
          message: "Update GitHub contribution snake"
